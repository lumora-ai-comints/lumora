<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Summarizer - Lumora</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

header{
    background:#4f46e5;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
}

input[type=file]{
    margin:20px 0;
    width:100%;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#372fcf;
}

#summary{
    margin-top:30px;
    background:#f7f7f7;
    padding:20px;
    border-radius:10px;
    white-space:pre-wrap;
    min-height:120px;
}

.back{
    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    background:#4f46e5;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

.back:hover{
    background:#372fcf;
}

</style>

</head>

<body>

<header>

<h1>📑 AI PDF Summarizer</h1>

<p>Upload your PDF and receive an AI-generated summary.</p>

</header>

<div class="container">

<div class="card">

<h2>Select PDF</h2>

<input
type="file"
id="pdfFile"
accept=".pdf"
>

<br>

<button onclick="uploadPDF()">

Generate Summary

</button>

<div id="summary">

Your summary will appear here...

</div>

<a href="dashboard.html" class="back">

← Back to Dashboard

</a>

</div>

</div>

<script>

async function uploadPDF(){

const file=document.getElementById("pdfFile").files[0];

if(!file){

alert("Please choose a PDF.");

return;

}

const formData=new FormData();

formData.append("pdf",file);

document.getElementById("summary").innerHTML="📄 Reading PDF...";

try{

const response=await fetch("/api/upload-pdf",{

method:"POST",

body:formData

});

const data=await response.json();

document.getElementById("summary").innerHTML=data.summary;

}
catch(error){

document.getElementById("summary").innerHTML="❌ Error uploading PDF.";

}

}

</script>

</body>
</html>
