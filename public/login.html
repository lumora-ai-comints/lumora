<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lumora</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    font-family:Arial,sans-serif;
}

.login-box{
    width:380px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}

.login-box h1{
    text-align:center;
    color:#4f46e5;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#372fcf;
}

#signupBtn{
    background:#10b981;
}

#signupBtn:hover{
    background:#059669;
}

#message{
    margin-top:15px;
    text-align:center;
    color:red;
}
</style>
</head>

<body>

<div class="login-box">

<h1>📘 Lumora</h1>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>

<button id="signupBtn">Create Account</button>

<p id="message"></p>

</div>
<script type="module" src="./login.js"></script>
</body>
</html>
